name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: typecheck + build + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22']
    steps:
      - uses: actions/checkout@v4
        with:
          # Several integration tests assert FROZEN-area zero-diff via
          # `git diff origin/main -- ...` (Phase 37 + Phase 19 invariants).
          # Depth 0 fetches the full history so the ref resolves.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      # npm ci runs postinstall → patch-package, which re-applies
      # the @ledgerhq/hw-app-btc / psbtv2 / errors patches that
      # work around upstream's broken ESM packaging (PR #139).
      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - run: npm test
